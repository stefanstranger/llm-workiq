[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-workiq"
version = "0.1.0"
description = "Use Microsoft WorkIQ's MCP tools with the LLM command-line tool"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["llm>=0.36"]

[project.urls]
Homepage = "https://github.com/stefanstranger/llm-workiq"
Issues = "https://github.com/stefanstranger/llm-workiq/issues"

[project.entry-points.llm]
workiq = "llm_workiq"

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["llm_workiq.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
