name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Test and build distribution
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Check whether this version is already on PyPI
        id: version
        run: |
          version=$(uv run --no-project --python 3.11 python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://pypi.org/pypi/llm-workiq/$version/json")
          if [ "$status" = "200" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $version is already on PyPI; bump the version in pyproject.toml to release."
          elif [ "$status" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected HTTP $status from PyPI while checking version $version."
            exit 1
          fi

      - name: Run tests and lint
        if: steps.version.outputs.publish == 'true'
        run: |
          uv sync --locked --group dev --python 3.11
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .

      - name: Build package
        if: steps.version.outputs.publish == 'true'
        run: uv build

      - name: Check package metadata
        if: steps.version.outputs.publish == 'true'
        run: uvx twine check dist/*

      - name: Upload build artifacts
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.build.outputs.version }} to PyPI
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/llm-workiq/${{ needs.build.outputs.version }}/
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
